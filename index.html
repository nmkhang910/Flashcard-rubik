<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Rubik Algorithms - Ultimate Beginner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            brand: { DEFAULT: '#FACC15', dark: '#EAB308' }
          }
        }
      }
    };
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .perspective-1000 { perspective: 1200px; }
    .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    body { background: #0f172a; background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); background-attachment: fixed; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    .glow-yellow { filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.4)); }
    .glow-blue { filter: drop-shadow(0 0 8px rgba(14, 165, 233, 0.4)); }
    
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes spin-slow { 100% { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 3s linear infinite; }
  </style>
</head>
<body class="text-slate-200 min-h-screen font-sans selection:bg-brand selection:text-slate-900">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-lg border-b border-slate-800">
    <div class="max-w-4xl mx-auto px-3 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 grid grid-cols-2 gap-0.5 p-1">
          <div class="bg-brand rounded-sm"></div><div class="bg-slate-600 rounded-sm"></div>
          <div class="bg-slate-600 rounded-sm"></div><div class="bg-brand rounded-sm"></div>
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-extrabold text-white tracking-tight">Ultimate Rubik</h1>
          <p class="text-[10px] text-brand font-semibold uppercase tracking-wider">2-Look OLL & PLL</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2 bg-slate-800 rounded-xl p-1 border border-slate-700">
        <button id="btnModeFlashcard" onclick="setViewMode('flashcard')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-brand text-slate-900 shadow">Thẻ</button>
        <button id="btnModeCheatsheet" onclick="setViewMode('cheatsheet')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">Bảng</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 py-4 flex flex-col gap-4">

    <!-- FILTERS & PROGRESS -->
    <section class="bg-slate-800/50 border border-slate-700/50 p-2 sm:p-3 rounded-2xl flex flex-col gap-3">
      <div class="flex overflow-x-auto gap-2 filter-scroll pb-1" id="filterButtons">
        <button onclick="setFilter('all')" data-filter="all" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">Tất cả</button>
        <button onclick="setFilter('oll1')" data-filter="oll1" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">OLL ① (Dấu thập)</button>
        <button onclick="setFilter('oll2')" data-filter="oll2" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">OLL ② (Góc)</button>
        <button onclick="setFilter('pll1')" data-filter="pll1" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">PLL ① (Góc)</button>
        <button onclick="setFilter('pll2')" data-filter="pll2" class="filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">PLL ② (Cạnh)</button>
      </div>
      
      <div class="flex items-center gap-3 px-1">
        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
          <div id="masteredBar" class="h-full bg-gradient-to-r from-emerald-400 to-emerald-500 transition-all duration-500" style="width: 0%"></div>
        </div>
        <span class="text-xs font-bold text-emerald-400 font-mono" id="masteredText">0/16</span>
      </div>
    </section>

    <!-- FLASHCARD AREA -->
    <section id="flashcardView" class="flex flex-col items-center">
      
      <div id="emptyFilterState" class="hidden w-full text-center py-12 bg-slate-800/30 rounded-3xl border border-slate-700/50">
        <div class="text-4xl mb-3">🎉</div>
        <h3 class="text-lg font-bold text-white mb-1">Đã thuộc hết nhóm này!</h3>
        <p class="text-sm text-slate-400 mb-5">Chuyển sang bảng tổng hợp để ôn luyện phản xạ nhé.</p>
        <button onclick="setFilter('all')" class="px-5 py-2.5 rounded-xl bg-brand text-slate-900 font-bold text-sm shadow-lg shadow-brand/20">Xem tất cả</button>
      </div>

      <div id="cardWrapper" class="w-full max-w-lg">
        <div class="flex justify-between items-center mb-2 px-1">
          <span id="cardCounter" class="text-xs font-bold text-slate-400 uppercase tracking-widest">Thẻ 1 / 16</span>
          <button onclick="shuffleCards()" class="text-xs font-semibold text-brand hover:text-yellow-300 flex items-center gap-1 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Xáo trộn
          </button>
        </div>

        <!-- CARD 3D -->
        <div class="perspective-1000 w-full h-[460px] sm:h-[500px] cursor-pointer" onclick="flipCard()">
          <div id="cardInner" class="relative w-full h-full transform-style-3d">
            
            <!-- MẶT TRƯỚC (Nhận diện) -->
            <div class="absolute inset-0 backface-hidden bg-slate-800 border border-slate-700 rounded-[2rem] p-5 flex flex-col justify-between shadow-2xl">
              <div class="flex justify-between items-start">
                <span id="frontStepBadge" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900/50 border border-slate-700"></span>
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0V11"/></svg>
                  Lật thẻ
                </span>
              </div>

              <div class="flex-1 flex flex-col items-center justify-center relative pt-6">
                <div id="setupIndicator" class="absolute top-0 w-full flex justify-center"></div>
                <div id="frontSvgContainer" class="w-52 h-52 sm:w-60 sm:h-60"></div>
              </div>

              <div class="bg-slate-900/60 rounded-xl p-3 text-center border border-slate-700/50">
                <p id="frontHintText" class="text-sm text-slate-300 font-medium leading-relaxed"></p>
              </div>
            </div>

            <!-- MẶT SAU (Công thức & Hướng dẫn) -->
            <div id="backFace" class="absolute inset-0 backface-hidden rotate-y-180 bg-slate-800 border-2 rounded-[2rem] p-5 flex flex-col justify-between shadow-2xl">
              <div class="flex items-start justify-between border-b border-slate-700/50 pb-3">
                <div>
                  <span id="backStepLabel" class="text-[10px] font-extrabold uppercase tracking-wider text-brand"></span>
                  <h2 id="backCaseName" class="text-2xl font-black text-white mt-1"></h2>
                </div>
                <div id="backMiniSvg" class="w-14 h-14 bg-slate-900 rounded-xl border border-slate-700 p-1"></div>
              </div>

              <!-- Công thức -->
              <div class="my-auto py-2">
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex justify-between">
                  <span>Algorithm</span>
                  <button onclick="event.stopPropagation(); copyAlgorithm()" class="text-brand hover:text-yellow-300">Copy 📋</button>
                </div>
                <div id="backAlgorithm" class="bg-slate-900 border border-slate-700 rounded-2xl px-3 py-3 text-center font-mono text-base sm:text-lg md:text-xl font-bold leading-relaxed break-words shadow-inner"></div>
                <div id="backAltAlgo" class="text-center text-xs text-slate-500 mt-2"></div>
              </div>

              <!-- Hướng dẫn Setup -->
              <div class="bg-brand/10 border border-brand/30 rounded-2xl p-4">
                <div class="flex items-center gap-2 mb-1.5">
                  <span class="text-brand text-lg">🎯</span>
                  <h4 class="text-xs font-bold text-brand uppercase tracking-wider">Cách cầm khối</h4>
                </div>
                <p id="backSetupText" class="text-sm text-slate-200 font-medium leading-relaxed"></p>
              </div>

              <!-- Nút đánh giá -->
              <div class="grid grid-cols-2 gap-2 mt-3">
                <button onclick="event.stopPropagation(); rateCard(false)" class="py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-bold text-slate-200 transition active:scale-95">Cần ôn lại</button>
                <button onclick="event.stopPropagation(); rateCard(true)" class="py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 text-xs font-bold transition active:scale-95 shadow-lg shadow-emerald-500/20">Đã thuộc ✓</button>
              </div>
            </div>

          </div>
        </div>

        <!-- ĐIỀU KHIỂN -->
        <div class="mt-4 flex gap-2">
          <button onclick="prevCard()" class="flex-1 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm font-bold text-slate-300 active:scale-95">Trước</button>
          <button onclick="nextCard()" class="flex-[2] py-3 rounded-xl bg-brand text-slate-900 text-sm font-black active:scale-95 shadow-lg shadow-brand/20">Tiếp theo</button>
        </div>
      </div>
    </section>

    <!-- CHEATSHEET AREA -->
    <section id="cheatsheetView" class="hidden flex-col gap-6 pb-10">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="cheatsheetGrid"></div>
    </section>

  </main>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-600 text-white text-sm font-bold px-5 py-2.5 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>

  <script>
    const FACE = {
      FRONT: '#22C55E', BACK: '#3B82F6', LEFT: '#F97316', RIGHT: '#EF4444', INACTIVE: '#1E293B'
    };

    const DATA = [
      // ================= OLL 1 =================
      {
        id: 'oll-line', type: 'oll', step: 'OLL ①', filter: 'oll1',
        name: 'Line', algo: "F (R U R' U') F'",
        hint: 'Tìm thanh ngang màu vàng (2 cạnh đối diện).',
        setup: 'Xoay U để thanh ngang nằm song song với bàn (từ Trái sang Phải).',
        top: [0,0,0, 1,1,1, 0,0,0],
        sides: { top:[0,1,0], bottom:[0,1,0], left:[0,0,0], right:[0,0,0] }
      },
      {
        id: 'oll-l', type: 'oll', step: 'OLL ①', filter: 'oll1',
        name: 'L-Shape', algo: "f (R U R' U') f'", alt: "Hoặc: F U R U' R' F'",
        hint: 'Tìm 2 cạnh vàng tạo thành góc vuông (chữ L).',
        setup: 'Xoay U để 2 cạnh vàng nằm ở hướng 6 giờ (mặt Trước) và 3 giờ (mặt Phải).',
        top: [0,0,0, 0,1,1, 0,1,0],
        sides: { top:[0,1,0], bottom:[0,0,0], left:[0,1,0], right:[0,0,0] }
      },
      {
        id: 'oll-dot', type: 'oll', step: 'OLL ①', filter: 'oll1',
        name: 'Dot', algo: "F (R U R' U') F' f (R U R' U') f'", alt: "Làm Line -> Ra chữ L -> Làm L-Shape",
        hint: 'Chỉ có tâm vàng, không có cạnh nào hướng lên.',
        setup: 'Cầm tùy ý. Thực hiện công thức Line, khối sẽ ra chữ L. Đừng xoay U, làm tiếp công thức L-Shape.',
        top: [0,0,0, 0,1,0, 0,0,0],
        sides: { top:[0,1,0], bottom:[0,1,0], left:[0,1,0], right:[0,1,0] }
      },
      // ================= OLL 2 =================
      {
        id: 'oll-sune', type: 'oll', step: 'OLL ②', filter: 'oll2',
        name: 'Sune', algo: "R U R' U R U2 R'",
        hint: 'Có dấu thập + 1 góc vàng trên đỉnh.',
        setup: 'Đặt góc vàng duy nhất ở góc Trên-Trái (Front-Left). Nhìn góc Dưới-Phải (Front-Right) thấy chữ V vàng chĩa ra trước.',
        top: [0,1,0, 1,1,1, 1,1,0],
        sides: { top:[1,0,0], bottom:[0,0,1], left:[0,0,0], right:[1,0,0] }
      },
      {
        id: 'oll-antisune', type: 'oll', step: 'OLL ②', filter: 'oll2',
        name: 'Anti-sune', algo: "R U2 R' U' R U' R'",
        hint: 'Có dấu thập + 1 góc vàng trên đỉnh.',
        setup: 'Đặt góc vàng duy nhất ở góc Trên-Trái (Front-Left). Nhìn góc Dưới-Trái (Front-Left) thấy chữ V vàng chĩa ra trước.',
        top: [1,1,0, 1,1,1, 0,1,0],
        sides: { top:[0,0,1], bottom:[1,0,0], left:[0,0,0], right:[0,0,1] }
      },
      {
        id: 'oll-h', type: 'oll', step: 'OLL ②', filter: 'oll2',
        name: 'H Algorithm', algo: "F (R U R' U')3 F'",
        hint: 'Chỉ có dấu thập. Hai bên hông có 2 cặp đèn pha.',
        setup: 'Xoay U để 2 cặp đèn pha hướng sang bên Trái và bên Phải (tạo thành hình chữ H).',
        top: [0,1,0, 1,1,1, 0,1,0],
        sides: { top:[0,0,0], bottom:[0,0,0], left:[1,0,1], right:[1,0,1] }
      },
      {
        id: 'oll-pi', type: 'oll', step: 'OLL ②', filter: 'oll2',
        name: 'Pi', algo: "R U2 (R2' U' R2 U') R2' U2 R",
        hint: 'Chỉ có dấu thập. Chỉ có duy nhất 1 cặp đèn pha.',
        setup: 'Xoay U để cặp đèn pha nằm ở bên TRÁI. Hai góc bên phải chĩa ra trước và sau.',
        top: [0,1,0, 1,1,1, 0,1,0],
        sides: { top:[0,0,1], bottom:[0,0,1], left:[1,0,1], right:[0,0,0] }
      },
      {
        id: 'oll-headlights', type: 'oll', step: 'OLL ②', filter: 'oll2',
        name: 'Headlights', algo: "R2 D (R' U2 R) D' (R' U2 R')",
        hint: 'Có 2 góc vàng đã đúng ở phía sau.',
        setup: 'Xoay U để 2 góc đã đúng nằm ở phía SAU (lưng bạn). Cặp đèn pha ở mặt Trước chĩa thẳng vào mắt bạn.',
        top: [1,1,1, 1,1,1, 0,1,0],
        sides: { top:[0,0,0], bottom:[1,0,1], left:[0,0,0], right:[0,0,0] }
      },
      {
        id: 'oll-t', type: 'oll', step: 'OLL ②', filter: 'oll2',
        name: 'T Algorithm', algo: "(r U R' U') (r' F R F')",
        hint: '2 góc vàng kề nhau tạo thành hình chữ T.',
        setup: 'Xoay U để chữ T nằm ngang, 2 góc vàng nằm ở bên PHẢI. Bên trái 2 góc chĩa ngược nhau.',
        top: [0,1,1, 1,1,1, 0,1,1],
        sides: { top:[1,0,0], bottom:[1,0,0], left:[0,0,0], right:[0,0,0] }
      },
      {
        id: 'oll-kite', type: 'oll', step: 'OLL ②', filter: 'oll2',
        name: 'Kite (Bowtie)', algo: "F' (r U R' U') (r' F R)",
        hint: '2 góc vàng nằm đối chéo nhau.',
        setup: 'Xoay U để 2 góc vàng chéo nằm ở Trên-Trái (BL) và Dưới-Phải (FR). Góc Dưới-Trái (FL) chĩa vàng ra trước.',
        top: [1,1,0, 1,1,1, 0,1,1],
        sides: { top:[0,0,0], bottom:[1,0,0], left:[0,0,0], right:[1,0,0] }
      },
      // ================= PLL 1 =================
      {
        id: 'pll-t', type: 'pll', step: 'PLL ①', filter: 'pll1',
        name: 'T-perm', algo: "R U R' U' R' F R2 U' R' U' R U R' F'",
        hint: 'Tìm 1 cặp Đèn pha (2 góc cùng màu). Mặt đối diện lộn xộn.',
        setup: 'Xoay U để cặp đèn pha nằm ở bên TRÁI. Bạn sẽ thấy 2 góc bên Phải bị hoán đổi.',
        sideState: { top:[FACE.BACK, FACE.FRONT, FACE.FRONT], bottom:[FACE.FRONT, FACE.BACK, FACE.BACK], left:[FACE.LEFT, FACE.LEFT, FACE.LEFT], right:[FACE.RIGHT, FACE.RIGHT, FACE.RIGHT] },
        arrows: [ { from: [0,2], to: [2,2], curve: -25 }, { from: [2,2], to: [0,2], curve: 25 }, { from: [0,1], to: [2,1], curve: -15 }, { from: [2,1], to: [0,1], curve: 15 } ]
      },
      {
        id: 'pll-y', type: 'pll', step: 'PLL ①', filter: 'pll1',
        name: 'Y-perm', algo: "F R U' R' U' R U R' F' R U R' U' R' F R F'",
        hint: 'Tìm 2 cặp Đèn pha. Các góc bị lộn xộn hoàn toàn.',
        setup: 'Xoay U để 1 cặp đèn pha nằm ở bên TRÁI. Các góc chéo nhau sẽ hoán đổi.',
        sideState: { top:[FACE.FRONT, FACE.LEFT, FACE.BACK], bottom:[FACE.FRONT, FACE.FRONT, FACE.BACK], left:[FACE.RIGHT, FACE.BACK, FACE.LEFT], right:[FACE.RIGHT, FACE.RIGHT, FACE.LEFT] },
        arrows: [ { from: [0,0], to: [2,2], curve: 30 }, { from: [2,2], to: [0,0], curve: -30 }, { from: [0,1], to: [1,0], curve: 15 }, { from: [1,0], to: [0,1], curve: -15 } ]
      },
      // ================= PLL 2 =================
      {
        id: 'pll-ua', type: 'pll', step: 'PLL ②', filter: 'pll2',
        name: 'Ua-perm', algo: "M2 U M U2 M' U M2", alt: "R/U: R2 U R U R' U' R' U' R' U R'",
        hint: 'Tìm 1 mặt đã giải hoàn toàn (3 viên cùng màu).',
        setup: 'Xoay U để mặt đã giải hoàn toàn nằm ở phía SAU (lưng bạn). 3 cạnh còn lại xoay ngược chiều kim đồng hồ.',
        sideState: { top:[FACE.BACK, FACE.BACK, FACE.BACK], bottom:[FACE.FRONT, FACE.LEFT, FACE.FRONT], left:[FACE.LEFT, FACE.RIGHT, FACE.LEFT], right:[FACE.RIGHT, FACE.FRONT, FACE.RIGHT] },
        arrows: [ { from: [0,1], to: [1,0], curve: 30 }, { from: [1,0], to: [1,2], curve: 30 }, { from: [1,2], to: [0,1], curve: -30 } ]
      },
      {
        id: 'pll-ub', type: 'pll', step: 'PLL ②', filter: 'pll2',
        name: 'Ub-perm', algo: "M2 U' M U2 M' U' M2", alt: "R/U: R U' R U R U R U' R' U' R2",
        hint: 'Tìm 1 mặt đã giải hoàn toàn (3 viên cùng màu).',
        setup: 'Xoay U để mặt đã giải hoàn toàn nằm ở phía SAU (lưng bạn). 3 cạnh còn lại xoay cùng chiều kim đồng hồ.',
        sideState: { top:[FACE.BACK, FACE.BACK, FACE.BACK], bottom:[FACE.FRONT, FACE.RIGHT, FACE.FRONT], left:[FACE.LEFT, FACE.FRONT, FACE.LEFT], right:[FACE.RIGHT, FACE.LEFT, FACE.RIGHT] },
        arrows: [ { from: [0,1], to: [1,2], curve: -30 }, { from: [1,2], to: [1,0], curve: -30 }, { from: [1,0], to: [0,1], curve: 30 } ]
      },
      {
        id: 'pll-h', type: 'pll', step: 'PLL ②', filter: 'pll2',
        name: 'H-perm', algo: "M2 U M2 U2 M2 U M2", alt: "Hoặc: M2 U' M2 U2 M2 U' M2",
        hint: 'Không có mặt nào đã giải. Các cạnh đối diện hoán đổi.',

      {
        id: 'pll-h', type: 'pll', step: 2, stepName: 'PLL ② • 4 Edges',
        name: 'H-perm', subtitle: '4 cạnh đối diện hoán đổi chéo (F↔B, L↔R)',
        algorithm: "M2 U M2 U2 M2 U M2", 
        altAlgorithm: "Hoặc: M2 U' M2 U2 M2 U' M2",
        hint: '0 mặt solved. Cạnh đối diện hoán đổi (Trước↔Sau, Trái↔Phải).',
        tip: 'Mọi mặt đều có 2 cạnh đối diện sai. Hoán đổi F↔B và L↔R cùng lúc → H.',
        sideState: {
          top:    [FACE.BACK, FACE.FRONT, FACE.BACK],
          bottom: [FACE.FRONT, FACE.BACK, FACE.FRONT],
          left:   [FACE.LEFT, FACE.RIGHT, FACE.LEFT],
          right:  [FACE.RIGHT, FACE.LEFT, FACE.RIGHT]
        },
        arrows: [
          { from: [0,1], to: [2,1], curve: -25 },
          { from: [2,1], to: [0,1], curve: 25 },
          { from: [1,0], to: [1,2], curve: -25 },
          { from: [1,2], to: [1,0], curve: 25 }
        ]
      },
      {
        id: 'pll-z', type: 'pll', step: 2, stepName: 'PLL ② • 4 Edges',
        name: 'Z-perm', subtitle: '4 cạnh kề hoán đổi (F↔L, B↔R)',
        algorithm: "M' U M2 U M2 U M' U2 M2",
        altAlgorithm: "Hoặc: M2 U M2 U M' U2 M2 U2 M'",
        hint: '0 mặt solved. Cạnh kề hoán đổi (Trước↔Trái, Sau↔Phải).',
        tip: 'Mọi mặt đều sai. Hoán đổi F↔L và B↔R (2 cặp cạnh kề) → Z.',
        sideState: {
          top:    [FACE.BACK, FACE.RIGHT, FACE.BACK],
          bottom: [FACE.FRONT, FACE.LEFT, FACE.FRONT],
          left:   [FACE.LEFT, FACE.FRONT, FACE.LEFT],
          right:  [FACE.RIGHT, FACE.BACK, FACE.RIGHT]
        },
        arrows: [
          { from: [0,1], to: [1,2], curve: -20 },
          { from: [1,2], to: [0,1], curve: 20 },
          { from: [2,1], to: [1,0], curve: -20 },
          { from: [1,0], to: [2,1], curve: 20 }
        ]
      }
    ];

    const ALL_CASES = [...OLL_CASES, ...PLL_CASES];
    const TOTAL = ALL_CASES.length;

    let currentFilter = 'all';
    let viewMode = 'flashcard';
    let filteredDeck = [...ALL_CASES];
    let currentIndex = 0;
    let isFlipped = false;
    let showHint = false;
    let masteredIds = new Set(JSON.parse(localStorage.getItem('ll_mastered_v1') || '[]'));
    let sessionFlips = 0;
    let confettiLaunched = false;
    let isSwiping = false;

    const MOVE_COLORS = {
      'R': 'text-sky-400', 'r': 'text-sky-300', 'L': 'text-orange-400', 'l': 'text-orange-300',
      'U': 'text-yellow-400', 'u': 'text-yellow-300', 'D': 'text-red-400', 'd': 'text-red-300',
      'F': 'text-emerald-400', 'f': 'text-emerald-300', 'B': 'text-purple-400', 'b': 'text-purple-300',
      'M': 'text-amber-400', 'm': 'text-amber-300'
    };

    function cellCenter(row, col) { return [36 + col * 49 + 23, 36 + row * 49 + 23]; }

    function drawArrow(from, to, curve = 0, color = '#0EA5E9') {
      const [x1, y1] = cellCenter(from[0], from[1]);
      const [x2, y2] = cellCenter(to[0], to[1]);
      const inset = 16;
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const ux = dx / len, uy = dy / len;
      const sx = x1 + ux * inset, sy = y1 + uy * inset;
      const ex = x2 - ux * inset, ey = y2 - uy * inset;
      const mx = (sx + ex) / 2, my = (sy + ey) / 2;
      const px = -uy, py = ux;
      const cx = mx + px * curve, cy = my + py * curve;
      const tdx = ex - cx, tdy = ey - cy;
      const tlen = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
      const tux = tdx / tlen, tuy = tdy / tlen;
      const nx = -tuy, ny = tux;
      const hLen = 8, hW = 4.5;
      const bx1 = ex - tux * hLen + nx * hW;
      const by1 = ey - tuy * hLen + ny * hW;
      const bx2 = ex - tux * hLen - nx * hW;
      const by2 = ey - tuy * hLen - ny * hW;
      const pathEx = ex - tux * (hLen * 0.7);
      const pathEy = ey - tuy * (hLen * 0.7);
      return `
        <path d="M ${sx} ${sy} Q ${cx} ${cy} ${pathEx} ${pathEy}" stroke="${color}" stroke-width="2.6" fill="none" stroke-linecap="round" class="sky-glow"/>
        <polygon points="${ex},${ey} ${bx1},${by1} ${bx2},${by2}" fill="${color}"/>
      `;
    }

    function generateOLLSvg(item, isMini = false) {
      const uid = `oll-${item.id}-${isMini ? 'm' : 'f'}`;
      const yellowLight = '#FDE047', yellowDark = '#EAB308';
      const darkTop = '#475569', darkBottom = '#334155';
      const cellSize = 46, gap = 3, start = 36, sideThickness = 11, sideGap = 5;
      const parts = [];
      parts.push(`
        <defs>
          <linearGradient id="yg-${uid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${yellowLight}"/>
            <stop offset="100%" stop-color="${yellowDark}"/>
          </linearGradient>
          <linearGradient id="dg-${uid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${darkTop}"/>
            <stop offset="100%" stop-color="${darkBottom}"/>
          </linearGradient>
        </defs>
        <rect x="16" y="16" width="188" height="188" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
      `);
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const idx = row * 3 + col;
          const isY = item.top[idx] === 1;
          const x = start + col * (cellSize + gap);
          const y = start + row * (cellSize + gap);
          parts.push(`<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" rx="7"
            fill="url(#${isY ? 'yg' : 'dg'}-${uid})"
            stroke="${isY ? yellowDark : '#1E293B'}" stroke-width="1.5"
            ${isY && !isMini ? 'class="yellow-glow"' : ''}/>`);
        }
      }
      for (let i = 0; i < 3; i++) {
        const pos = start + i * (cellSize + gap);
        parts.push(`<rect x="${pos + 2}" y="${start - sideGap - sideThickness}" width="${cellSize - 4}" height="${sideThickness}" rx="4" fill="${item.sides.top[i] === 1 ? yellowLight : FACE.INACTIVE}"/>`);
        const bY = start + 3 * cellSize + 2 * gap + sideGap;
        parts.push(`<rect x="${pos + 2}" y="${bY}" width="${cellSize - 4}" height="${sideThickness}" rx="4" fill="${item.sides.bottom[i] === 1 ? yellowLight : FACE.INACTIVE}"/>`);
        parts.push(`<rect x="${start - sideGap - sideThickness}" y="${pos + 2}" width="${sideThickness}" height="${cellSize - 4}" rx="4" fill="${item.sides.left[i] === 1 ? yellowLight : FACE.INACTIVE}"/>`);
        const rX = start + 3 * cellSize + 2 * gap + sideGap;
        parts.push(`<rect x="${rX}" y="${pos + 2}" width="${sideThickness}" height="${cellSize - 4}" rx="4" fill="${item.sides.right[i] === 1 ? yellowLight : FACE.INACTIVE}"/>`);
      }
      return `<svg viewBox="0 0 220 220" class="w-full h-full overflow-visible" aria-label="Sơ đồ ${item.name}">${parts.join('')}</svg>`;
    }

    function generatePLLSvg(item, isMini = false) {
      const uid = `pll-${item.id}-${isMini ? 'm' : 'f'}`;
      const yellowLight = '#FDE047', yellowDark = '#EAB308';
      const cellSize = 46, gap = 3, start = 36, sideThickness = 11, sideGap = 5;
      const parts = [];
      parts.push(`
        <defs>
          <linearGradient id="pyg-${uid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${yellowLight}"/>
            <stop offset="100%" stop-color="${yellowDark}"/>
          </linearGradient>
        </defs>
        <rect x="16" y="16" width="188" height="188" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
      `);
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const x = start + col * (cellSize + gap);
          const y = start + row * (cellSize + gap);
          parts.push(`<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" rx="7"
            fill="url(#pyg-${uid})" stroke="${yellowDark}" stroke-width="1.5"
            ${!isMini ? 'class="yellow-glow"' : ''}/>`);
        }
      }
      const ss = item.sideState || {};
      const getC = (key, idx) => (ss[key] && ss[key][idx]) || FACE.INACTIVE;
      for (let i = 0; i < 3; i++) {
        const pos = start + i * (cellSize + gap);
        parts.push(`<rect x="${pos + 2}" y="${start - sideGap - sideThickness}" width="${cellSize - 4}" height="${sideThickness}" rx="4" fill="${getC('top', i)}" stroke="#0F172A" stroke-width="0.8"/>`);
        const bY = start + 3 * cellSize + 2 * gap + sideGap;
        parts.push(`<rect x="${pos + 2}" y="${bY}" width="${cellSize - 4}" height="${sideThickness}" rx="4" fill="${getC('bottom', i)}" stroke="#0F172A" stroke-width="0.8"/>`);
        parts.push(`<rect x="${start - sideGap - sideThickness}" y="${pos + 2}" width="${sideThickness}" height="${cellSize - 4}" rx="4" fill="${getC('left', i)}" stroke="#0F172A" stroke-width="0.8"/>`);
        const rX = start + 3 * cellSize + 2 * gap + sideGap;
        parts.push(`<rect x="${rX}" y="${pos + 2}" width="${sideThickness}" height="${cellSize - 4}" rx="4" fill="${getC('right', i)}" stroke="#0F172A" stroke-width="0.8"/>`);
      }
      if (item.arrows) {
        item.arrows.forEach(a => {
          parts.push(drawArrow(a.from, a.to, a.curve, '#0EA5E9'));
        });
      }
      return `<svg viewBox="0 0 220 220" class="w-full h-full overflow-visible" aria-label="Sơ đồ ${item.name}">${parts.join('')}</svg>`;
    }

    function generateCardSvg(item, isMini = false) {
      return item.type === 'pll' ? generatePLLSvg(item, isMini) : generateOLLSvg(item, isMini);
    }

    function formatAlgorithmHTML(algo) {
      let html = algo.replace(/([RLUDFBrludfbM])(['2]?)/g, (m, letter, suffix) => {
        const cls = MOVE_COLORS[letter] || 'text-yellow-300';
        return `<span class="${cls}">${letter}${suffix}</span>`;
      });
      return html.replace(/\(/g, '<span class="text-slate-600 font-normal">(</span>')
                 .replace(/\)/g, '<span class="text-slate-600 font-normal">)</span>');
    }

    function saveProgress() {
      localStorage.setItem('ll_mastered_v1', JSON.stringify([...masteredIds]));
      updateProgressUI();
    }

    function updateProgressUI() {
      const mastered = masteredIds.size;
      document.getElementById('masteredText').textContent = `${mastered}/${TOTAL}`;
      document.getElementById('masteredBar').style.width = `${(mastered / TOTAL) * 100}%`;
      document.getElementById('unlearnedCount').textContent = TOTAL - mastered;
      if (mastered === TOTAL && !confettiLaunched) {
        confettiLaunched = true;
        launchConfetti();
        showToast('🎉 Hoàn hảo! Bạn đã thuộc toàn bộ 16 công thức!', 4000);
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const active = btn.dataset.filter === filter;
        const isPll = filter.startsWith('pll');
        let activeCls = 'bg-slate-700 text-white ring-1 ring-yellow-400/50';
        if (isPll && active) activeCls = 'bg-slate-700 text-white ring-1 ring-sky-400/50';
        btn.className = 'filter-btn px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-semibold transition ' +
          (active ? activeCls : 'bg-slate-800/70 text-slate-400 hover:text-white');
      });
      applyFilterAndRender();
    }

    function applyFilterAndRender() {
      if (currentFilter === 'all') filteredDeck = [...ALL_CASES];
      else if (currentFilter === 'oll1') filteredDeck = OLL_CASES.filter(c => c.step === 1);
      else if (currentFilter === 'oll2') filteredDeck = OLL_CASES.filter(c => c.step === 2);
      else if (currentFilter === 'pll1') filteredDeck = PLL_CASES.filter(c => c.step === 1);
      else if (currentFilter === 'pll2') filteredDeck = PLL_CASES.filter(c => c.step === 2);
      else if (currentFilter === 'unlearned') filteredDeck = ALL_CASES.filter(c => !masteredIds.has(c.id));
      currentIndex = 0; isFlipped = false; showHint = false;
      renderFlashcard();
      renderCheatsheet();
    }

    function renderFlashcard() {
      const wrapper = document.getElementById('cardWrapper');
      const empty = document.getElementById('emptyFilterState');
      if (filteredDeck.length === 0) {
        wrapper.classList.add('hidden');
        empty.classList.remove('hidden');
        const allMastered = masteredIds.size === TOTAL;
        if (allMastered) {
          document.getElementById('emptyTitle').textContent = '🎉 Hoàn hảo! Thuộc toàn bộ 16 công thức!';
          document.getElementById('emptyDesc').textContent = 'Chuyển sang xem tất cả để luyện phản xạ.';
        } else {
          document.getElementById('emptyTitle').textContent = 'Tuyệt vời! Nhóm này đã xong';
          document.getElementById('emptyDesc').textContent = 'Chuyển sang xem tất cả để luyện phản xạ.';
        }
        return;
      }
      wrapper.classList.remove('hidden');
      empty.classList.add('hidden');
      if (currentIndex >= filteredDeck.length) currentIndex = 0;
      const item = filteredDeck[currentIndex];
      const isMastered = masteredIds.has(item.id);
      const isPll = item.type === 'pll';

      const inner = document.getElementById('cardInner');
      inner.classList.toggle('rotate-y-180', isFlipped);

      document.getElementById('cardCounter').textContent = `Thẻ ${currentIndex + 1} / ${filteredDeck.length}`;
      document.getElementById('frontStepBadge').textContent = item.stepName;

      const stepBadge = document.getElementById('frontStepBadge');
      if (isPll) stepBadge.className = 'px-2.5 py-1 rounded-full text-[10px] sm:text-[11px] font-bold bg-sky-400/15 text-sky-300 border border-sky-400/30';
      else stepBadge.className = 'px-2.5 py-1 rounded-full text-[10px] sm:text-[11px] font-bold bg-yellow-400/15 text-yellow-400 border border-yellow-400/30';

      const badge = document.getElementById('frontStatusBadge');
      if (isMastered) {
        badge.textContent = '✓ Đã thuộc';
        badge.className = 'px-2 py-1 rounded-full text-[10px] sm:text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
      } else {
        badge.textContent = 'Cần luyện';
        badge.className = 'px-2 py-1 rounded-full text-[10px] sm:text-[11px] font-semibold bg-slate-800 text-slate-400';
      }

      document.getElementById('backFace').className = 'absolute inset-0 backface-hidden rotate-y-180 card-surface border-2 rounded-3xl p-4 sm:p-6 flex flex-col justify-between shadow-2xl ' + (isPll ? 'border-sky-400/40' : 'border-yellow-400/40');
      document.getElementById('frontSvgContainer').innerHTML = generateCardSvg(item, false);

      const hintBox = document.getElementById('hintBox');
      const hintBtnText = document.getElementById('hintBtnText');
      if (showHint) {
        hintBox.textContent = item.hint;
        hintBox.classList.remove('hidden');
        hintBtnText.textContent = 'Ẩn gợi ý';
      } else {
        hintBox.classList.add('hidden');
        hintBtnText.textContent = 'Gợi ý';
      }

      const backLabel = document.getElementById('backStepLabel');
      backLabel.textContent = item.stepName;
      backLabel.className = isPll ? 'text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-sky-400' : 'text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-yellow-400';

      document.getElementById('backCaseName').textContent = item.name;
      document.getElementById('backCaseSub').textContent = item.subtitle;
      document.getElementById('backMiniSvg').innerHTML = generateCardSvg(item, true);
      document.getElementById('backAlgorithm').innerHTML = formatAlgorithmHTML(item.algorithm);
      document.getElementById('backAltAlgo').textContent = item.altAlgorithm || '';
      document.getElementById('backTip').textContent = item.tip;

      const btn = document.getElementById('btnToggleMastered');
      const lbl = document.getElementById('btnMasteredLabel');
      if (isMastered) {
        btn.className = 'flex items-center justify-center gap-1 py-2.5 px-2 rounded-xl bg-emerald-500 text-slate-950 text-xs sm:text-sm font-extrabold transition active:scale-95 shadow-lg shadow-emerald-500/20';
        lbl.textContent = 'Đã thuộc ✓';
      } else {
        btn.className = 'flex items-center justify-center gap-1 py-2.5 px-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-xs sm:text-sm font-bold text-emerald-300 transition active:scale-95';
        lbl.textContent = 'Thuộc';
      }
    }

    function handleCardClick() { if (!isSwiping) flipCard(); }
    function flipCard() { isFlipped = !isFlipped; document.getElementById('cardInner').classList.toggle('rotate-y-180', isFlipped); if (isFlipped) { sessionFlips++; document.getElementById('sessionFlips').textContent = sessionFlips; } }
    function toggleHint() { showHint = !showHint; renderFlashcard(); }
    function nextCard() { if (!filteredDeck.length) return; isFlipped = false; showHint = false; currentIndex = (currentIndex + 1) % filteredDeck.length; renderFlashcard(); }
    function prevCard() { if (!filteredDeck.length) return; isFlipped = false; showHint = false; currentIndex = (currentIndex - 1 + filteredDeck.length) % filteredDeck.length; renderFlashcard(); }
    
    function shuffleCards() {
      if (filteredDeck.length <= 1) return;
      for (let i = filteredDeck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [filteredDeck[i], filteredDeck[j]] = [filteredDeck[j], filteredDeck[i]]; }
      currentIndex = 0; isFlipped = false; showHint = false; renderFlashcard(); showToast('🔀 Đã xáo trộn!');
    }

    function toggleMasteredCurrent() {
      if (!filteredDeck.length) return;
      const item = filteredDeck[currentIndex];
      const wasMastered = masteredIds.has(item.id);
      const btn = document.getElementById('btnToggleMastered');
      btn.classList.add('tap-anim'); setTimeout(() => btn.classList.remove('tap-anim'), 250);
      if (wasMastered) masteredIds.delete(item.id); else masteredIds.add(item.id);
      saveProgress();
      if (currentFilter === 'unlearned') {
        filteredDeck = ALL_CASES.filter(c => !masteredIds.has(c.id));
        if (currentIndex >= filteredDeck.length) currentIndex = Math.max(0, filteredDeck.length - 1);
        isFlipped = false; showHint = false;
      }
      renderFlashcard(); renderCheatsheet();
      if (!wasMastered) showToast('✓ Đã đánh dấu thuộc!');
    }

    function rateCard(remembered) {
      if (!filteredDeck.length) return;
      const item = filteredDeck[currentIndex];
      if (remembered && !masteredIds.has(item.id)) { masteredIds.add(item.id); saveProgress(); showToast('✓ Tuyệt vời!'); }
      else if (!remembered) showToast('↻ Sẽ gặp lại!');
      renderCheatsheet(); nextCard();
    }

    function toggleMasteredById(id) {
      if (masteredIds.has(id)) masteredIds.delete(id); else masteredIds.add(id);
      saveProgress(); renderCheatsheet(); renderFlashcard();
    }

    function resetProgress() {
      if (!confirm('Bạn có chắc muốn đặt lại toàn bộ tiến độ học?')) return;
      masteredIds.clear(); confettiLaunched = false; saveProgress(); applyFilterAndRender(); showToast('Đã đặt lại.');
    }

    function copyAlgorithm() {
      if (!filteredDeck.length) return;
      const text = filteredDeck[currentIndex].algorithm;
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'absolute'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      showToast(`📋 ${text.length > 30 ? text.slice(0, 30) + '…' : text}`);
    }

    function showToast(msg, duration = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.remove('opacity-0'); t.classList.add('opacity-100');
      clearTimeout(window._toast);
      window._toast = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, duration);
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#FACC15', '#22C55E', '#3B82F6', '#EF4444', '#A855F7', '#EC4899', '#0EA5E9'];
      for (let i = 0; i < 120; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece'; el.style.left = Math.random() * 100 + 'vw';
        el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDelay = (Math.random() * 0.6) + 's'; el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
        el.style.transform = `rotate(${Math.random() * 360}deg)`;
        container.appendChild(el); setTimeout(() => el.remove(), 5000);
      }
    }

    function setViewMode(mode) {
      viewMode = mode;
      const fv = document.getElementById('flashcardView'), cv = document.getElementById('cheatsheetView');
      const bf = document.getElementById('btnModeFlashcard'), bc = document.getElementById('btnModeCheatsheet');
      if (mode === 'flashcard') {
        fv.classList.remove('hidden'); cv.classList.add('hidden');
        bf.className = 'px-2.5 py-1.5 rounded-md text-[11px] sm:text-xs font-semibold transition-all bg-yellow-400 text-slate-950 shadow';
        bc.className = 'px-2.5 py-1.5 rounded-md text-[11px] sm:text-xs font-semibold transition-all text-slate-300 hover:text-white';
      } else {
        fv.classList.add('hidden'); cv.classList.remove('hidden'); cv.classList.add('flex');
        bc.className = 'px-2.5 py-1.5 rounded-md text-[11px] sm:text-xs font-semibold transition-all bg-sky-400 text-slate-950 shadow';
        bf.className = 'px-2.5 py-1.5 rounded-md text-[11px] sm:text-xs font-semibold transition-all text-slate-300 hover:text-white';
        renderCheatsheet();
      }
    }

    function renderCheatsheet() {
      const build = (item) => {
        const m = masteredIds.has(item.id);
        const isPll = item.type === 'pll';
        return `
          <div class="bg-slate-900/90 border ${m ? 'border-emerald-500/40' : 'border-slate-800'} rounded-2xl p-3 flex flex-col gap-2.5 hover:border-slate-700 transition">
            <div class="flex items-center gap-2.5">
              <div class="w-16 h-16 sm:w-20 sm:h-20 shrink-0">${generateCardSvg(item, true)}</div>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2">
                  <h3 class="text-sm font-bold text-white truncate">${item.name}</h3>
                  <button onclick="toggleMasteredById('${item.id}')" title="Đánh dấu đã thuộc" class="w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold transition shrink-0 ${m ? 'bg-emerald-500 text-slate-950 check-pop' : 'bg-slate-800 text-slate-400 hover:text-white'}">✓</button>
                </div>
                <p class="text-[11px] text-slate-400 line-clamp-2 mt-0.5 leading-snug">${item.subtitle}</p>
              </div>
            </div>
            <div class="bg-slate-950 border ${isPll ? 'border-sky-900/50' : 'border-slate-800/90'} rounded-xl px-2.5 py-2 font-mono text-[11px] sm:text-sm font-bold text-center leading-relaxed break-words">${formatAlgorithmHTML(item.algorithm)}</div>
            <p class="text-[10px] sm:text-[11px] text-slate-400 leading-relaxed"><span class="text-emerald-400 font-semibold">Mẹo:</span> ${item.tip}</p>
          </div>
        `;
      };
      document.getElementById('gridOll1').innerHTML = OLL_CASES.filter(c => c.step === 1).map(build).join('');
      document.getElementById('gridOll2').innerHTML = OLL_CASES.filter(c => c.step === 2).map(build).join('');
      document.getElementById('gridPll1').innerHTML = PLL_CASES.filter(c => c.step === 1).map(build).join('');
      document.getElementById('gridPll2').innerHTML = PLL_CASES.filter(c => c.step === 2).map(build).join('');
    }

    function openHelp() { const m = document.getElementById('helpModal'); m.classList.remove('hidden'); m.classList.add('flex'); }
    function closeHelp() { const m = document.getElementById('helpModal'); m.classList.add('hidden'); m.classList.remove('flex'); }

    (function setupSwipe() {
      const zone = document.getElementById('cardTouchZone');
      if (!zone) return;
      let startX = 0, startY = 0, moved = false;
      zone.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; moved = false; }, { passive: true });
      zone.addEventListener('touchmove', (e) => { const dx = Math.abs(e.touches[0].clientX - startX), dy = Math.abs(e.touches[0].clientY - startY); if (dx > 10 || dy > 10) moved = true; }, { passive: true });
      zone.addEventListener('touchend', (e) => {
        if (!moved) return;
        const dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 55) {
          isSwiping = true;
          if (dx > 0) prevCard(); else nextCard();
          setTimeout(() => { isSwiping = false; }, 350);
        }
      }, { passive: true });
    })();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeHelp(); return; }
      if (e.target.matches('input, textarea')) return;
      if (e.code === 'Space' && e.target.closest('button')) return;
      if (e.key === '?') { e.preventDefault(); openHelp(); return; }
      if (viewMode !== 'flashcard') return;
      switch (e.code) {
        case 'Space': e.preventDefault(); flipCard(); break;
        case 'ArrowRight': nextCard(); break;
        case 'ArrowLeft': prevCard(); break;
        case 'KeyH': toggleHint(); break;
        case 'KeyM': toggleMasteredCurrent(); break;
        case 'KeyS': shuffleCards(); break;
        case 'KeyC': copyAlgorithm(); break;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateProgressUI(); setFilter('all'); renderFlashcard(); renderCheatsheet();
    });
  </script>
</body>
</html>
